name: Build Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Unpack project.zip
        id: p
        run: |
          mkdir -p work
          unzip -q project.zip -d work
          F=$(find work -name settings.gradle.kts | head -1)
          echo "dir=$(dirname "$F")" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ARMAN-APP-STORE-debug-apk
          path: ${{ steps.p.outputs.dir }}/app/build/outputs/apk/debug/*.apk
